# Dependency update PRs. Dependabot floors these values at min-release-age from
# .npmrc, so the seven day soak holds either way and the cooldown mainly buys
# the longer window for majors. Security updates bypass both.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Our own experimental builds are pinned by hand and change often
    ignore:
      - dependency-name: "@cashu/cashu-ts"
    groups:
      # One PR per family: these move together and are reviewed together
      noble-scure:
        patterns:
          - "@noble/*"
          - "@scure/*"
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
